<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০ নং চৌগ্রাম আনসার ও ভিডিপি AVMIS</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --primary: #1b5e20;
            --secondary: #2e7d32;
            --accent: #4caf50;
            --bg: #f4f6f8;
            --text: #333;
        }
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            direction: ltr;
        }
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .slogan {
            font-size: 13px;
            background: rgba(255,255,255,0.15);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        h1 { font-size: 18px; margin: 5px 0; }
        .container { max-width: 600px; margin: 15px auto; padding: 10px; }
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        button {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 8px;
            font-weight: bold;
        }
        button:hover { background-color: var(--primary); }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .logo-box {
            width: 80px;
            height: 80px;
            border: 2px dashed #bbb;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .flex-group { display: flex; gap: 10px; }
        .flex-group > div { flex: 1; }
        .tab-bar { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-bar button { flex: 1; padding: 8px; font-size: 12px; background: #ddd; color: #333; }
        .tab-bar button.active { background: var(--primary); color: white; }
        .hidden { display: none; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #ff9800; color: white; }
        .badge-confirmed { background: #4caf50; color: white; }
        .badge-blocked { background: #f44336; color: white; }
    </style>
</head>
<body>

<header>
    <div class="slogan">শান্তি-শৃঙ্খলা ও উন্নয়ন ও নিরাপত্তা সর্বোচ্চ আমরা</div>
    <div class="logo-box" id="appLogoDisplay">
        <span style="font-size:10px; color:#777;">লোগো</span>
    </div>
    <h1>১০ নং চৌগ্রাম আনসার ও ভিডিপি AVMIS</h1>
</header>

<div class="container">
    <!-- উপরের ট্যাব বাটন -->
    <div class="tab-bar">
        <button class="active" onclick="switchTab('applyTab')">সদস্য আবেদন/লগইন</button>
        <button onclick="switchTab('execTab')">কার্যকরী সদস্য</button>
        <button onclick="switchTab('adminTab')">এডমিন প্যানেল</button>
    </div>

    <!-- ট্যাব ১: সদস্য আবেদন ও লগইন -->
    <div id="applyTab" class="card">
        <h3>সদস্য কর্নার</h3>
        <div class="flex-group">
            <button onclick="showSubTab('regForm')">নতুন আবেদন</button>
            <button onclick="showSubTab('loginForm')">সদস্য লগইন</button>
        </div>

        <!-- রেজিস্ট্রেশন ফরম -->
        <div id="regForm" style="margin-top:15px;">
            <h4>সদস্য আবেদন ফরম</h4>
            <form id="memberApplicationForm" onsubmit="submitApplication(event)">
                <label>১. নিজের পূর্ণ নাম:</label>
                <input type="text" id="mName" required>

                <label>২. নিজের ছবি (ক্যামেরা বা গ্যালারি):</label>
                <input type="file" accept="image/*" id="mPhoto" capture="environment" required>

                <label>৩. এন আইডি কার্ড (সামনের ছবি):</label>
                <input type="file" accept="image/*" id="mNidFront" capture="environment" required>

                <label>৪. এন আইডি কার্ড (পিছনের ছবি):</label>
                <input type="file" accept="image/*" id="mNidBack" capture="environment" required>

                <label>৫. পেমেন্ট গেটওয়ে (বিকাশ/নগদ/রকেট):</label>
                <select id="mPaymentMethod">
                    <option value="Bkash">বিকাশ</option>
                    <option value="Nagad">নগদ</option>
                    <option value="Rocket">রকেট</option>
                </select>
                <input type="text" id="mTxId" placeholder="ট্রানজ্যাকশন আইডি (TrxID) দিন" required>

                <label>৬. অভিভাবকের নম্বর (ভেরিফিকেশনের জন্য):</label>
                <input type="tel" id="mGuardianNo" required>

                <label>৭. সার্টিফিকেটের ছবি:</label>
                <input type="file" accept="image/*" id="mCert" capture="environment" required>

                <label>৮. রক্তের গ্রুপ:</label>
                <select id="mBlood" required>
                    <option value="A+">A+</option><option value="A-">A-</option>
                    <option value="B+">B+</option><option value="B-">B-</option>
                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                    <option value="O+">O+</option><option value="O-">O-</option>
                </select>

                <label>৯. স্বাক্ষর (ছবির ফাইল বা আপলোড):</label>
                <input type="file" accept="image/*" id="mSign" required>

                <label>১০. নিজ নম্বর (ইউজার নেম হিসেবে ব্যবহৃত হবে):</label>
                <input type="tel" id="mPhone" required>

                <label>১১. ৬ সংখ্যার পিন (লগইনের জন্য):</label>
                <input type="password" id="mPin" maxlength="6" pattern="\d{6}" placeholder="৬ সংখ্যার পিন" required>

                <label>১২. জন্মদিন / মাস / সাল:</label>
                <input type="date" id="mDob" required>

                <label>১৩. গ্রাম / ডাকঘর / ওয়ার্ড / পাড়া:</label>
                <textarea id="mAddress" rows="2" required></textarea>

                <button type="submit">আবেদন জমা দিন</button>
            </form>
        </div>

        <!-- মেম্বার লগইন -->
        <div id="loginForm" class="hidden" style="margin-top:15px;">
            <h4>সদস্য লগইন ও প্রোফাইল স্ট্যাটাস</h4>
            <input type="tel" id="loginPhone" placeholder="নিজ নম্বর (ইউজার নেম)">
            <input type="password" id="loginPin" placeholder="৬ সংখ্যার পিন" maxlength="6">
            <button onclick="memberLogin()">লগইন করুন</button>
            
            <div id="memberProfileView" class="hidden" style="margin-top:15px; border-top:1px solid #ddd; padding-top:10px;">
                <!-- ডাইনামিক মেম্বার প্রোফাইল -->
            </div>
        </div>
    </div>

    <!-- ট্যাব ২: কার্যকরী সদস্য প্রোফাইল -->
    <div id="execTab" class="card hidden">
        <h3>কার্যকরী সদস্যবৃন্দের প্রোফাইল (২ জন)</h3>
        <div id="execContainer">
            <!-- কার্যকরী সদস্য ১ -->
            <div style="background:#e8f5e9; padding:10px; border-radius:6px; margin-bottom:10px;">
                <h4>কার্যকরী সদস্য ১</h4>
                <div class="logo-box" id="exec1PhotoBox"><span style="font-size:10px;">ছবি</span></div>
                <input type="file" id="e1Photo" accept="image/*">
                <input type="text" id="e1Name" placeholder="নাম">
                <input type="tel" id="e1Phone" placeholder="ফোন নম্বর">
                <input type="email" id="e1Email" placeholder="Gmail (এডমিন ইউজারনেম)">
                <input type="tel" id="e1Whatsapp" placeholder="WhatsApp নম্বর">
                <input type="text" id="e1Role" placeholder="পদবি">
                <input type="password" id="e1Pin" placeholder="এডমিন পিন (নতুন)">
            </div>
            <!-- কার্যকরী সদস্য ২ -->
            <div style="background:#e8f5e9; padding:10px; border-radius:6px; margin-bottom:10px;">
                <h4>কার্যকরী সদস্য ২</h4>
                <div class="logo-box" id="exec2PhotoBox"><span style="font-size:10px;">ছবি</span></div>
                <input type="file" id="e2Photo" accept="image/*">
                <input type="text" id="e2Name" placeholder="নাম">
                <input type="tel" id="e2Phone" placeholder="ফোন নম্বর">
                <input type="email" id="e2Email" placeholder="Gmail">
                <input type="tel" id="e2Whatsapp" placeholder="WhatsApp নম্বর">
                <input type="text" id="e2Role" placeholder="পদবি">
                <input type="password" id="e2Pin" placeholder="এডমিন পিন (নতুন)">
            </div>
            <button onclick="saveAndLockExecutives()" style="background:#c62828;">🔒 তথ্য সেভ ও চিরতরে লক করুন</button>
        </div>
        <div id="execDisplayView" style="margin-top:15px;"></div>
    </div>

    <!-- ট্যাব ৩: এডমিন প্যানেল -->
    <div id="adminTab" class="card hidden">
        <h3>এডমিন প্যানেল লগইন</h3>
        <div id="adminLoginBox">
            <input type="email" id="adminEmail" placeholder="আপনার Gmail (ইউজারনেম)">
            <input type="password" id="adminPin" placeholder="এডমিন পিন">
            <button onclick="adminLogin()">এডমিন লগইন</button>
        </div>

        <div id="adminDashboard" class="hidden" style="margin-top:15px;">
            <h4>ড্যাশবোর্ড ও পরিসংখ্যান</h4>
            <div id="statsBox" style="background:#e3f2fd; padding:10px; border-radius:5px; margin-bottom:10px;"></div>
            <button onclick="exportDataCSV()" style="background:#1976d2;">📥 সকল ডাটা CSV ফাইল হিসেবে ডাউনলোড</button>
            <div id="applicantsList" style="margin-top:15px;"></div>
        </div>
    </div>
</div>

<script>
    // Firebase Initialization
    const firebaseConfig = {
      apiKey: "AIzaSyC-K9QXOkFLCoENsmAJMpkF3iARhtzNJlU",
      authDomain: "chowgram-64be4.firebaseapp.com",
      projectId: "chowgram-64be4",
      storageBucket: "chowgram-64be4.firebasestorage.app",
      messagingSenderId: "297528570656",
      appId: "1:297528570656:web:7ce1f16ccd75a50f471d45"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    // টগল নেভিগেশন
    function switchTab(tabId) {
        document.getElementById('applyTab').classList.add('hidden');
        document.getElementById('execTab').classList.add('hidden');
        document.getElementById('adminTab').classList.add('hidden');
        document.getElementById(tabId).classList.remove('hidden');

        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        
        if(tabId === 'execTab') loadExecutables();
    }

    function showSubTab(subId) {
        if(subId === 'regForm') {
            document.getElementById('regForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
        } else {
            document.getElementById('regForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }
    }

    // লোকাল স্টোরেজ ডাটা ম্যানেজমেন্ট
    function getStoredData(key) {
        return JSON.parse(localStorage.getItem(key)) || [];
    }

    function setStoredData(key, data) {
        localStorage.setItem(key, JSON.stringify(data));
    }

    // লোগো ও কার্যকরী প্রোফাইল পার্সিস্টেন্স
    window.onload = function() {
        let savedLogo = localStorage.getItem('avmis_logo');
        if(savedLogo) document.getElementById('appLogoDisplay').innerHTML = `<img src="${savedLogo}">`;
        
        loadExecutables();
        checkExecLockStatus();
    }

    function saveAndLockExecutives() {
        if(!confirm("একবার লক করলে আর পরিবর্তন করা যাবে না। নিশ্চিত করুন?")) return;
        
        let execData = {
            e1Name: document.getElementById('e1Name').value,
            e1Phone: document.getElementById('e1Phone').value,
            e1Email: document.getElementById('e1Email').value,
            e1Whatsapp: document.getElementById('e1Whatsapp').value,
            e1Role: document.getElementById('e1Role').value,
            e1Pin: document.getElementById('e1Pin').value,
            
            e2Name: document.getElementById('e2Name').value,
            e2Phone: document.getElementById('e2Phone').value,
            e2Email: document.getElementById('e2Email').value,
            e2Whatsapp: document.getElementById('e2Whatsapp').value,
            e2Role: document.getElementById('e2Role').value,
            e2Pin: document.getElementById('e2Pin').value,
            locked: true
        };
        setStoredData('avmis_execs', execData);
        alert("কার্যকরী সদস্যদের তথ্য সফলভাবে সেভ ও লক করা হয়েছে!");
        loadExecutables();
    }

    function loadExecutables() {
        let execs = getStoredData('avmis_execs');
        let view = document.getElementById('execDisplayView');
        let formContainer = document.getElementById('execContainer');

        if(execs && execs.locked) {
            formContainer.classList.add('hidden');
            view.innerHTML = `
                <div style="background:#fff; border:1px solid #ddd; padding:10px; border-radius:5px;">
                    <h4>১. ${execs.e1Name || 'কার্যকরী সদস্য'} (${execs.e1Role || ''})</h4>
                    <p>ফোন: ${execs.e1Phone} | WhatsApp: ${execs.e1Whatsapp} | Email: ${execs.e1Email}</p>
                    <hr>
                    <h4>২. ${execs.e2Name || 'কার্যকরী সদস্য'} (${execs.e2Role || ''})</h4>
                    <p>ফোন: ${execs.e2Phone} | WhatsApp: ${execs.e2Whatsapp} | Email: ${execs.e2Email}</p>
                    <p style="color:green; font-weight:bold; text-align:center;">🔒 প্রোফাইল স্থায়ীভাবে লক করা আছে</p>
                </div>
            `;
        }
    }

    function checkExecLockStatus() {
        let execs = getStoredData('avmis_execs');
        if(execs && execs.locked) {
            document.getElementById('execContainer').classList.add('hidden');
        }
    }

    // সদস্য আবেদন সাবমিট
    function submitApplication(event) {
        event.preventDefault();
        
        let reader = new FileReader();
        let photoFile = document.getElementById('mPhoto').files[0];
        
        reader.onload = function(e) {
            let photoUrl = e.target.result;
            let applicants = getStoredData('avmis_applicants');
            
            let newApplicant = {
                id: Date.now(),
                name: document.getElementById('mName').value,
                phone: document.getElementById('mPhone').value,
                pin: document.getElementById('mPin').value,
                payment: document.getElementById('mPaymentMethod').value,
                txId: document.getElementById('mTxId').value,
                guardian: document.getElementById('mGuardianNo').value,
                blood: document.getElementById('mBlood').value,
                dob: document.getElementById('mDob').value,
                address: document.getElementById('mAddress').value,
                date: new Date().toLocaleDateString(),
                status: 'Pending', // Pending, Confirmed, Blocked
                photo: photoUrl
            };

            applicants.push(newApplicant);
            setStoredData('avmis_applicants', applicants);
            alert("আপনার আবেদন সফলভাবে জমা হয়েছে!");
            document.getElementById('memberApplicationForm').reset();
        }
        if(photoFile) reader.readAsDataURL(photoFile);
    }

    // সদস্য লগইন
    function memberLogin() {
        let phone = document.getElementById('loginPhone').value;
        let pin = document.getElementById('loginPin').value;
        let applicants = getStoredData('avmis_applicants');

        let user = applicants.find(a => a.phone === phone && a.pin === pin);
        let profileView = document.getElementById('memberProfileView');
        profileView.classList.remove('hidden');

        if(user) {
            let statusBadge = user.status === 'Confirmed' ? '<span class="badge badge-confirmed">কনফার্মড</span>' :
                              user.status === 'Blocked' ? '<span class="badge badge-blocked">ব্লকড</span>' : '<span class="badge badge-pending">পেন্ডিং</span>';

            profileView.innerHTML = `
                <img src="${user.photo}" style="width:70px; height:70px; border-radius:50%; object-fit:cover;">
                <h4>নাম: ${user.name}</h4>
                <p>নম্বর: ${user.phone}</p>
                <p>রক্তের গ্রুপ: ${user.blood}</p>
                <p>আবেদনের তারিখ: ${user.date}</p>
                <p>স্ট্যাটাস: ${statusBadge}</p>
            `;
        } else {
            profileView.innerHTML = `<p style="color:red;">ভুল নম্বর অথবা পিন!</p>`;
        }
    }

    // এডমিন লগইন
    function adminLogin() {
        let email = document.getElementById('adminEmail').value;
        let pin = document.getElementById('adminPin').value;
        let execs = getStoredData('avmis_execs');

        if(execs && (execs.e1Email === email && execs.e1Pin === pin) || (execs.e2Email === email && execs.e2Pin === pin)) {
            document.getElementById('adminLoginBox').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadAdminDashboard();
        } else {
            alert("সঠিক এডমিন জিমেইল ও পিন প্রদান করুন!");
        }
    }

    function loadAdminDashboard() {
        let applicants = getStoredData('avmis_applicants');
        let total = applicants.length;
        
        document.getElementById('statsBox').innerHTML = `
            <b>মোট আবেদন:</b> ${total} জন <br>
        `;

        let listHtml = '<h4>আবেদনকারীদের তালিকা:</h4>';
        applicants.forEach((app, index) => {
            listHtml += `
                <div style="background:#fff; padding:8px; margin-bottom:5px; border-radius:4px; border:1px solid #ccc;">
                    <b>${index + 1}. ${app.name}</b> (${app.phone}) - স্ট্যাটাস: <b>${app.status}</b><br>
                    <button onclick="changeStatus(${app.id}, 'Confirmed')" style="background:green; width:auto; padding:3px 8px; font-size:11px;">কনফার্ম</button>
                    <button onclick="changeStatus(${app.id}, 'Blocked')" style="background:orange; width:auto; padding:3px 8px; font-size:11px;">ব্লক</button>
                    <button onclick="deleteApplicant(${app.id})" style="background:red; width:auto; padding:3px 8px; font-size:11px;">ডিলিট</button>
                </div>
            `;
        });
        document.getElementById('applicantsList').innerHTML = listHtml;
    }

    function changeStatus(id, status) {
        let applicants = getStoredData('avmis_applicants');
        applicants = applicants.map(a => a.id === id ? {...a, status: status} : a);
        setStoredData('avmis_applicants', applicants);
        loadAdminDashboard();
    }

    function deleteApplicant(id) {
        if(!confirm("নিশ্চিত ডিলিট করতে চান?")) return;
        let applicants = getStoredData('avmis_applicants');
        applicants = applicants.filter(a => a.id !== id);
        setStoredData('avmis_applicants', applicants);
        loadAdminDashboard();
    }

    function exportDataCSV() {
        let applicants = getStoredData('avmis_applicants');
        let csvContent = "data:text/csv;charset=utf-8,Name,Phone,Blood,Status,Date\n";
        applicants.forEach(a => {
            csvContent += `${a.name},${a.phone},${a.blood},${a.status},${a.date}\n`;
        });
        let encodedUri = encodeURI(csvContent);
        let link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "avmis_applicants.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
